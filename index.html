담고 싶은 장면: 여름 바닷가 가족 여행
모형 재질: 정밀 모형
받침 형태: 원형
분위기: 밝고 화창한
추가 요소: 없음
출력 비율: 1:1

[정보 요청]
사진과 나의 입력을 바탕으로 피규어, 배경 세트, 소품을 구성한다.
1. 피규어: 사진 속 인물을 작은 3D 피규어로 변환한다. 인원수와 서는 순서, 간격, 자세, 옷 색과 형태, 헤어스타일, 얼굴 특징을 유지해 누구인지 알아볼 수 있게 한다. 표정은 사진보다 밝게 하고 손발은 단순하게 다듬는다.
2. 배경 세트: 담고 싶은 장면을 축소 모형으로 구성한다. 지형에 높낮이를 주어 입체감을 만들고 식물, 건물, 길과 추가 요소를 어울리게 배치한다. 사진 배경이 장면과 다르면 입력한 장면을 우선한다.
3. 질감: 입력한 모형 재질의 표면 특성을 모든 요소에 일관되게 적용한다. 잔디와 나무는 실제 모형 재료로 만든 듯한 결과 입자를 살리고, 재질에 맞는 색감과 마감을 쓴다.
4. 비율: 피규어를 화면에서 가장 크게 두고 배경 요소는 그보다 작게 배치해 인물이 주인공이 되게 한다. 인물 키를 기준으로 나무와 건물 높이를 정해 축척을 통일한다.
5. 받침: 입력한 받침 형태로 세트를 담고 옆면에 흙과 잔디 단면이 보이게 한다. 받침 전체가 화면에 들어오고 바깥은 단색 배경이나 책상으로 둔다.

[이미지 요청]
축소 모형을 접사로 촬영한 사진처럼 표현. 얕은 심도로 뒤쪽을 흐리게 하고 눈높이에 가까운 낮은 각도에서 본다. 부드러운 자연광, 사실적 재질감, 고해상도. 입력한 분위기에 맞는 하늘과 빛을 쓴다.

[제외 요청]
왜곡되거나 다른 사람처럼 변한 얼굴, 인원수 변경, 실물 크기 배경, 잘린 받침, 떠 있는 오브젝트, 어긋난 축척, 등각 투영, 평면적 조명, 과도한 채도, 텍스트, 저해상도.`,bodyEn:``,beforeLabel:`BEFORE`,afterLabel:`AFTER`,next:``,hidden:!1}]},{id:`p-1794473877462-voyb`,cat:`제품 & 상업 광고`,title:`캐릭터 시트 만들기`,icon:`✨`,tag:``,versions:[{id:`v-1794473877462-194e`,name:`기본`,type:`이미지 생성`,photo:!0,guideKo:`인물 사진 1장, 나의 입력 부분은 수정해서 사용`,guideEn:``,bodyKo:`[나의 입력]
캐릭터 콘셉트: 특전사 군인
드로잉 재료: 색연필
섹션 구성: 전신, 옆모습, 뒷모습, 소품, 의상 디테일, 색 팔레트
섹션 이름표: 한글
노트 형태: 링 바인더
출력 비율: 4:3

[정보 요청]
사진 속 인물을 캐릭터로 재해석해 디자인 시트 한 페이지를 구성한다.
1. 콘셉트 결정: 콘셉트가 입력되지 않으면 사진 속 인상, 나이대, 체형, 옷차림, 분위기를 읽어 그 사람에게 어울리는 캐릭터 콘셉트를 하나 정한다. 입력되면 그대로 따른다.
2. 인물 유지: 얼굴 특징, 헤어스타일, 체형을 알아볼 수 있게 남기고 손으로 그린 선맛을 살린다. 페이지의 모든 그림이 같은 사람으로 보이게 한다.
3. 중심 그림: 가운데에 콘셉트 복장을 갖춘 전신 그림을 가장 크고 완성도 높게 그린다. 그 옆에 얼굴 클로즈업 하나를 더하고 정해진 콘셉트 이름을 손글씨 제목으로 위쪽에 적는다.
4. 섹션 배치: 입력한 섹션을 페이지에 나눠 놓고 각 섹션 위에 밑줄 친 손글씨 이름표를 단다. 표정은 4~6개를 모아 그리고 각각 감정을 한 단어로 적으며, 뒷모습은 전신으로, 소품은 3~5개를 서로 다른 각도의 습작으로, 색 팔레트는 네모 색 견본을 나란히 칠한다.
5. 주석: 그림 옆에 짧은 한글 손글씨 주석을 단다. 주석마다 가는 지시선을 그어 해당 부위와 잇고 전체 12개 이내, 각 12자 이내로 쓴다.
6. 노트 박스: 한쪽에 네모 칸을 그려 캐릭터의 성격과 배경을 두세 줄로 적고, 그 아래에 체크 표시가 있는 짧은 항목 3개를 더한다.
7. 종이와 완성도: 결이 보이는 종이 위에 그려진 상태로 표현하고 제본 부분과 모서리 눌림을 남긴다. 완성된 그림과 밑그림 단계를 섞고 지운 자국과 보조선을 남긴다.

[이미지 요청]
작가의 캐릭터 디자인 시트를 위에서 내려다보며 찍은 사진처럼 표현. 사실적인 종이 결과 재료 번짐, 고른 자연광, 페이지 전체가 화면에 들어오는 구도, 고해상도.

[제외 요청]
사진처럼 사실적인 인물, 디지털 벡터 느낌, 인쇄체 폰트, 그림마다 다른 얼굴, 주석 없는 지시선, 서로 교차하는 지시선, 빈 섹션, 여백이 많은 구성, 잘린 페이지, 오탈자, 4K해상도.`,bodyEn:``,beforeImg:`./images/0fa25eedcc17.jpg`,afterImg:`./images/8ccf413aae39.jpg`,beforeLabel:`BEFORE`,afterLabel:`AFTER`,next:``,hidden:!1}]},{id:`p-1794473745883-xljk`,cat:`인물 & 프로필`,title:`스케치북에 그린 스케치`,icon:`✨`,tag:``,versions:[{id:`v-1794473745883-0pah`,name:`기본`,type:`이미지 생성`,photo:!0,guideKo:`인물 사진 1장, 드로잉 재료 등 수정 가능`,guideEn:``,bodyKo:`[나의 입력]
드로잉 재료: 연필
메모·낙서: 없음
노트 형태: 스프링 스케치북
출력 비율: 3:4

[정보 요청]
사진 속 인물을 참고해 자유롭게 그린 낙서장 스타일의 스케치북 한 페이지를 만든다.
1. 인물: 사진 속 얼굴 특징, 헤어스타일, 체형, 의상을 알아볼 수 있게 유지한다. 같은 인물을 얼굴, 상반신, 전신 등 다양한 크기와 구도로 여러 번 스케치한다.
2. 드로잉: 입력한 드로잉 재료의 선, 명암, 번짐 등 실제 손그림 특성을 살린다. 완성된 그림과 빠른 습작, 미완성 그림을 자연스럽게 섞고 밑선, 덧그은 선, 지우개 자국 등의 흔적을 남긴다.
3. 분위기: 입력한 스케치 분위기에 맞춰 그림의 표정과 자세, 선의 느낌, 페이지의 전체적인 밀도와 연출을 조절한다.
4. 메모·낙서: 입력한 정도에 따라 짧은 손글씨와 별, 하트, 꽃, 선 등의 가벼운 낙서를 그림 사이에 자유롭게 추가한다. 자동이면 스케치 분위기와 어울리는 종류와 양을 알아서 정한다.
5. 노트 구성: 입력한 노트 형태의 실제 종이 위에 그린 것처럼 표현한다. 정해진 칸 없이 크고 작은 그림을 페이지 곳곳에 자연스럽게 배치하고, 종이 질감과 제본 흔적을 살린다.

[이미지 요청]
실제 사용하던 스케치북 한 페이지를 위에서 촬영한 듯 표현. 자연스러운 종이 질감, 손그림 흔적. 원본 사진 속 인물은 결과물에 넣지 않는다.

[제외 요청]
정돈된 디자인 시트 형태, 칸으로 나눈 구성, 인쇄체 글씨, 디지털 일러스트 느낌, 사진처럼 사실적인 그림, 지나치게 깔끔하거나 완성된 그림, 사진처럼 사실적인 인물, 디지털 벡터 느낌, 인쇄체 폰트, 그림마다 다른 얼굴, 빈 섹션, 여백이 많은 구성, 잘린 페이지, 오탈자, 저해상도.`,bodyEn:``,beforeImg:`./images/0fa25eedcc17.jpg`,afterImg:`./images/abbf0ef72c4c.jpg`,beforeLabel:`BEFORE`,afterLabel:`AFTER`,next:``,hidden:!1}]},{id:`p-1794473622677-gwli`,cat:`인물 & 프로필`,title:`미니 미니 미니멀하게`,icon:`✨`,tag:``,versions:[{id:`v-1794473622677-frzh`,name:`기본`,type:`이미지 생성`,photo:!0,guideKo:`인물사진 1장, 크기, 위치,  등 수정 가능`,guideEn:``,bodyKo:`[나의 입력]
미니미 크기: 손바닥 크기
미니미 위치: 손바닥 위
동작: 앉기, 손 흔들기
시선: 카메라를 향함
출력 비율: 1:1

[정보 요청]
사진 속 인물을 작게 축소해 실제 공간에 존재하는 것처럼 합성한다.
1. 미니미: 얼굴 특징, 헤어스타일, 의상 색과 형태를 유지한 채 사람의 몸 비율 그대로 작게 만든다. 인형이나 캐릭터가 아니라 실제 사람이 작아진 모습으로 표현하고 옷 주름과 머리카락도 그 크기에 맞게 가늘게 그린다.
2. 배치: 입력한 위치에 입력한 크기로 놓고 몸 전체가 화면에 들어오게 한다. 배경 사진이 첨부되면 그 공간에, 없으면 원본 사진의 공간이나 손 위에 배치한다.
3. 스케일: 주변 사물과의 크기 차이를 일관되게 유지한다. 손금이나 나뭇결, 컵 두께 같은 표면의 세부가 미니미보다 크게 보이도록 맞춘다.
4. 접촉과 그림자: 발이 닿는 면에 눌림과 접촉 그림자를 넣고 그림자 방향과 길이를 주변 광원에 일치시킨다. 닿는 면의 재질에 따라 그림자의 선명도를 달리한다.
5. 초점: 미니미와 접촉면에 초점을 맞추고 그 뒤를 흐린다. 미니미가 화면 높이의 4분의 1 이상을 차지하게 한다.
6. 원본 유지: 배경이 되는 손이나 공간은 원본 사진 그대로 두고 다시 그리지 않는다. 미니미만 새로 더하고 원본의 화질과 색조를 그대로 맞춘다.

[이미지 요청]
접사 렌즈로 촬영한 사진처럼 표현. 얕은 심도, 자연광, 사실적인 피부와 원단 질감, 고해상도. 미니미의 눈높이에 가까운 낮은 각도에서 본다.

[제외 요청]
공중에 떠 있는 인물, 그림자 없는 합성, 어긋난 크기 비율, 광원이 맞지 않는 그림자, 인형처럼 굳은 자세, 원본과 다른 얼굴, 오려 붙인 듯한 외곽, 인형 관절과 이음선, 텍스트, 4K해상도.`,bodyEn:``,beforeImg:`./images/0fa25eedcc17.jpg`,afterImg:`./images/3fef1e76b0bb.jpg`,beforeLabel:`BEFORE`,afterLabel:`AFTER`,next:``,hidden:!1}]},{id:`p-1794473467164-157r`,cat:`인물 & 프로필`,title:`미래 직업 체험`,icon:`✨`,tag:``,versions:[{id:`v-1794473467164-w0yy`,name:`기본`,type:`이미지 생성`,photo:!0,guideKo:`인물 사진 1장, 직업 5개는 수정해서 사용`,guideEn:``,bodyKo:`직업 5개: 요리사, 패셔니스트, 웹툰작가, 개발자, 로봇기사
표현 형식: 폴라로이드 인화물 | 바닥: 원목 책상
제목: 나의 직업 체험
출력 비율: 4:3

[정보 요청]
사진 속 인물이 다섯 가지 직업의 복장을 갖추고 각 근무 현장에 있는 사진 다섯 장을 만들고, 그 인화물이 바닥에 놓인 장면을 촬영한 것처럼 구성한다.
1. 인물 동일성: 다섯 장 모두 같은 인물로 보이게 한다. 얼굴 특징, 나이, 성별, 피부 톤, 체형을 사진 그대로 유지하고 표정과 자세만 조금씩 다르게 한다. 헤어스타일은 직업 규정에 맞게 정돈하되 인상은 그대로 둔다.
2. 복장: 각 직업이 실제로 착용하는 복장과 보호구, 명찰, 신발을 재현한다. 실제 기관의 표장이나 상호는 넣지 않고 형태만 일반화한다. 여러 직업의 요소를 섞지 않는다.
3. 소품과 자세: 직업을 대표하는 장비를 한두 개만 들거나 곁에 두고 그 일을 하는 사람의 자연스러운 자세를 취하게 한다. 화기·칼·실화기 등 위험한 도구는 손에 들지 않게 하고 상징 소품은 장당 세 개 이내로 제한한다.
4. 각 컷의 배경: 해당 직업의 실제 근무 공간을 배경에 두고 인물보다 확실히 흐리게 처리한다. 각 배경이 서로 겹치지 않게 하고 배경 인물은 넣지 않는다.
5. 컷 내부 촬영 조건 고정: 인물을 화면 좌우 정중앙에 세우고 화면 높이의 3분의 2를 차지하게 한다. 카메라는 눈높이, 조명은 밝고 고른 빛으로 다섯 장 모두 통일한다.
6. 인화물: 다섯 장을 입력한 표현 형식대로 실물처럼 만든다. 종이 두께와 테두리, 인화지 질감, 모서리의 미세한 휨과 바닥에 지는 그림자를 살린다. 다섯 장의 크기와 테두리는 서로 같게 한다.
7. 배치: 바닥 위에 다섯 장을 조금씩 다른 각도로 놓고 서로 살짝 겹치게 한다. 인물 얼굴은 겹치는 부분에 오지 않게 하고 다섯 장 모두 전체 형태가 화면 안에 들어오게 한다.
8. 주변: 여백에 손글씨로 직업명을 적고, 직업 체험을 떠올리게 하는 소품 세 개 이내를 놓는다. 제목은 한쪽 여백에 손글씨나 스티커 라벨로 한 줄만 넣는다.

[이미지 요청]
책상 위 인화물을 위에서 비스듬히 내려다보며 찍은 사진처럼 표현. 창가 자연광, 얕은 심도, 부드러운 그림자, 사실적인 인물과 원단 질감, 사실적인 종이와 나무 질감, 자연스러운 명암, 고해상도. 다섯 장의 배경 밝기와 색 보정을 같게 유지한다.

[제외 요청]
평면적인 격자 배열, 디지털 프레임과 반듯한 정렬, 사진처럼 보이지 않는 인화물, 사진과 다른 사람으로 보이는 얼굴, 얼굴이 가려진 사진, 실제 기관 표장과 상호, 위험하거나 사고 장면, 복장 규정에 맞지 않는 표현, 성인용 크기의 장비, 한쪽으로 치우친 구도, 배경 인물, 잘린 인화물, 오탈자, 영문 표기, 4K해상도.`,bodyEn:``,beforeImg:`./images/0fa25eedcc17.jpg`,afterImg:`./images/f4d194fdb452.jpg`,beforeLabel:`BEFORE`,afterLabel:`AFTER`,next:``,hidden:!1}]},{id:`p-1794473213449-7qnq`,cat:`인물 & 프로필`,title:`스티커(이름)`,icon:`✨`,tag:``,versions:[{id:`v-1794473213449-h5hn`,name:`기본`,type:`이미지 생성`,photo:!0,guideKo:`이름 스티커에 포함되었으면 하는 이미지 1장을 첨부해 주세요.(도안 스티커의 경우 제외), 이름은 디어로에서 원하는 이름으로 변경`,guideEn:``,bodyKo:`이름: 디어로
소개: 그림 그리기와 동물을 좋아하는 어린이
분위기: 따뜻하고 정겨운
스티커 유형: 얼굴 스티커 (대표 예시: 얼굴 스티커, 도안 스티커 중 택1) 
스티커 스타일: 첨부한 이미지를 색연필 스타일로 생성
출력 비율: 1:1

[정보 요청]
사진과 입력 정보를 근거로 상징, 형태, 이름 표기, 배색, 장식을 자동 생성한다.
1. 상징: 소개에서 핵심 키워드 1~2개를 뽑아 단순한 도형이나 소품으로 변환해 2번의 주 형태에 결합한다. 그림이면 크레용·팔레트, 동물이면 발자국·리본 등 좋아하는 것이 한눈에 읽히게 한다.
2. 형태: 입력한 스티커 유형에 따라 구성한다. 이름 스티커는 사진 속 대상을 캐릭터로 단순화하고 얼굴형·실루엣·의상 색을 유지하며 표정과 자세를 분위기에 맞춘다. 도안 스티커는 인물 묘사를 배제하고 1번의 상징을 기하학적 도형으로 정제해 단일 마크로 만든다.
3. 이름 표기: 이름을 하단 배너 또는 띠 안에 표기. 분위기에 맞는 글자 형태를 선택하고 오탈자 없이 정확히 쓴다. 글자를 크게 배치하고 자간을 넓혀 가독성을 확보한다.
4. 배색: 소개와 분위기에서 도출한 색 1~2가지를 주조색으로 정해 형태·프레임·배너에 통일 적용. 배경은 무채색으로 두고 주조색이 화면에서 세 번 이상 반복되게 한다.
5. 장식: 분위기에 맞는 보조 요소 3~5개를 주 형태 주변에 좌우 대칭으로 배치. 원형 프레임, 리본, 반짝임, 잎사귀, 말풍선 등에서 분위기에 맞게 선정한다.
6. 단색 대응: 색을 제거해도 실루엣과 명암만으로 형태가 구분되도록 구성한다.

[이미지 요청]
정사각형 스티커. 입력한 스타일의 질감과 선, 여백이 넉넉한 흰 배경, 시선이 중앙에 모이는 대칭 구도, 상하좌우 균등한 여백.
중앙: 원형 또는 아치형 프레임 안에 주 형태를 배치.
하단: 이름 배너를 프레임과 겹치도록 배치.
축소 사용을 고려해 선 굵기를 일정하게 유지하고 세부 묘사를 최소화한다. 외곽을 정리해 배경 제거 후에도 형태가 유지되게 한다.

[제외 요청]
사진 그대로의 사실적 묘사, 복잡한 배경, 과도한 그림자, 난잡한 장식, 잘린 텍스트, 읽을 수 없는 한글, 오탈자, 불필요한 영어 문구, 흐릿한 선, 4K해상도.`,bodyEn:``,beforeImg:`./images/0fa25eedcc17.jpg`,afterImg:`./images/30eb65604317.jpg`,beforeLabel:`BEFORE`,afterLabel:`AFTER`,next:``,hidden:!1}]},{id:`p-1794473065565-gvrf`,cat:`인물 & 프로필`,title:`동물상 3D 카툰 일러`,icon:`✨`,tag:``,versions:[{id:`v-1794473065565-jxqw`,name:`기본`,type:`이미지 생성`,photo:!0,guideKo:`인물 얼굴 사진 1장, 출력 비율: 카드뉴스형 1:1, 3D 카툰 일러스트`,guideEn:``,bodyKo:`사진에서 보이는 외형적 특징만 근거로 동물상 3종, 비율, 분석 문구를 자동 생성한다.
1. 동물상: 대중적으로 잘 알려진 동물 중 얼굴 인상과 어울리는 3종 선정, 합계 100%가 되도록 순위별 퍼센트 배분.
2. 특징 분석: 얼굴형·눈매·눈썹·코·입매·턱선·전체 분위기 7개 항목을 사진과 일치하게 긍정적 표현으로 작성. 항목당 한 줄, 외모 평가나 단점 언급은 배제.
3. 하단 문구: 결과에 맞춘 다정한 한글 문장 2줄 생성.
4. 고정 문구는 변경하지 않는다. 제목 "동물상 분석 결과", 상단 배너 "TOP3 퍼센트 + 얼굴 특징 분석", 중앙 리본 "당신만의 매력 포인트 가득!"

[이미지 요청]
세로형 카드 포스터. 크림·아이보리·골드·연핑크 파스텔 톤, 부드러운 종이 질감, 금박 테두리, 둥근 모서리, 별·하트·리본 장식, 고해상도 카툰, 따뜻한 조명, 정돈된 레이아웃.
상단: 금색 리본과 별 장식, 진한 갈색 한글 제목과 배너 문구.
중앙: 원형 프레임 안에 사진 속 인물 기반 전신 캐릭터. 눈매·눈썹·얼굴형·코·입매·피부톤·헤어스타일을 사진과 닮게 유지, 밝은 미소 또는 윙크 표정, 캐주얼 의상, 주변에 별빛과 하트.

- 타깃 고객: [예: 1인 크리에이터 및 중소 마케팅 에이전시]
- 핵심 차별점: [예: 기존 대비 80% 시간 단축, 고품질 듀얼 프롬프트 지원]

2. Problem (타깃 고객이 겪는 3대 고통점)
